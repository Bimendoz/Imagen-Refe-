<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encuadre Pro V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; } /* zinc-950 */
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; } /* zinc-800 */
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; } /* zinc-700 */

        /* Canvas interaction & background */
        canvas {
            touch-action: none;
            cursor: grab;
            transition: opacity 0.3s ease;
        }
        canvas:active { cursor: grabbing; }
        
        /* Transparent checkerboard */
        .bg-checker {
            background-color: #18181b; /* zinc-900 */
            background-image: 
                linear-gradient(45deg, #27272a 25%, transparent 25%, transparent 75%, #27272a 75%, #27272a),
                linear-gradient(45deg, #27272a 25%, transparent 25%, transparent 75%, #27272a 75%, #27272a);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 6px;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #60a5fa; /* blue-400 */
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.4);
            border: 2px solid #1e3a8a;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #3f3f46; /* zinc-700 */
            border-radius: 3px;
        }

        /* Checkbox Styling */
        .guide-checkbox {
            appearance: none;
            background-color: #27272a;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 1px solid #52525b;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .guide-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: transform;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .guide-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .guide-checkbox:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 h-screen w-screen overflow-hidden flex flex-col lg:flex-row selection:bg-blue-500/30">

    <!-- Canvas Area -->
    <main class="flex-1 relative bg-checker flex items-center justify-center p-2 lg:p-6 h-[55vh] lg:h-screen border-b lg:border-b-0 lg:border-r border-zinc-800">
        <!-- Toast Notification -->
        <div id="toast" class="absolute top-4 left-1/2 -translate-x-1/2 bg-zinc-800 text-white px-4 py-2 rounded-full shadow-lg text-sm opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
            <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="toastMsg">Acción completada</span>
        </div>

        <div class="relative w-full h-full flex items-center justify-center">
            <canvas id="mainCanvas" class="max-w-full max-h-full object-contain shadow-2xl rounded opacity-0 ring-1 ring-white/5"></canvas>
            
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-zinc-500">
                <svg class="w-12 h-12 mb-3 animate-pulse text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-sm font-medium tracking-wide">Cargando lienzo...</p>
            </div>
        </div>
    </main>

    <!-- Sidebar Controls -->
    <aside class="w-full lg:w-[420px] bg-zinc-950 flex flex-col h-[45vh] lg:h-screen z-10 flex-shrink-0 shadow-2xl">
        
        <!-- Header -->
        <header class="p-5 border-b border-zinc-800 bg-zinc-900/50 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 shadow-inner">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8V6a2 2 0 012-2h2M3 16v2a2 2 0 002 2h2M16 3h2a2 2 0 012 2v2M16 21h2a2 2 0 002-2v-2M9 9h6v6H9z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">Encuadre Pro</h1>
                    <p class="text-xs text-zinc-400 uppercase tracking-widest font-semibold">V3.0</p>
                </div>
            </div>
        </header>

        <!-- Scrollable Controls -->
        <div class="flex-1 overflow-y-auto p-6 space-y-8">
            
            <!-- 1. Media Uploads -->
            <section>
                <h2 class="text-xs font-bold text-zinc-500 tracking-widest uppercase mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Archivos
                </h2>
                
                <div class="space-y-3">
                    <label class="relative flex flex-col items-center justify-center w-full p-4 border-2 border-zinc-800 border-dashed rounded-xl cursor-pointer hover:border-zinc-600 hover:bg-zinc-900/50 transition-all group">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-zinc-800 rounded-lg group-hover:bg-zinc-700 transition-colors">
                                <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14"></path></svg>
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-zinc-200">1. Cambiar Imagen Fondo</p>
                                <p class="text-xs text-zinc-500">Haz clic para buscar</p>
                            </div>
                        </div>
                        <input type="file" id="baseImageInput" accept="image/*" class="hidden">
                    </label>

                    <label class="relative flex flex-col items-center justify-center w-full p-4 border border-blue-900/50 bg-blue-900/10 rounded-xl cursor-pointer hover:bg-blue-900/20 hover:border-blue-800/50 transition-all group">
                        <div class="flex items-center gap-3 w-full justify-center">
                            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <span class="text-sm font-semibold text-blue-300">2. Cargar Logo / Estampado</span>
                        </div>
                        <input type="file" id="logoImageInput" accept="image/*" class="hidden">
                    </label>
                </div>
            </section>

            <!-- 2. Logo Adjustments -->
            <section class="opacity-50 pointer-events-none transition-opacity duration-300" id="logoControlsSection">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xs font-bold text-zinc-500 tracking-widest uppercase flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        Ajustes de Logo
                    </h2>
                    <button id="resetLogoBtn" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded transition-colors uppercase tracking-wide font-semibold">Centrar</button>
                </div>
                
                <div class="space-y-5 bg-zinc-900/50 p-4 rounded-xl border border-zinc-800">
                    <!-- Scale -->
                    <div>
                        <div class="flex justify-between items-center text-sm mb-2">
                            <span class="text-zinc-300 font-medium">Tamaño</span>
                            <span id="scaleValue" class="text-blue-400 font-mono text-xs">100%</span>
                        </div>
                        <input type="range" id="logoScale" min="0.05" max="3" step="0.05" value="1">
                    </div>
                    
                    <!-- Opacity -->
                    <div>
                        <div class="flex justify-between items-center text-sm mb-2">
                            <span class="text-zinc-300 font-medium">Opacidad</span>
                            <span id="opacityValue" class="text-blue-400 font-mono text-xs">100%</span>
                        </div>
                        <input type="range" id="logoOpacity" min="0.1" max="1" step="0.05" value="1">
                    </div>

                    <p class="text-xs text-zinc-500 flex items-center gap-1.5 justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                        Puedes arrastrar el logo en el lienzo.
                    </p>
                </div>
            </section>

            <!-- 3. Guides -->
            <section>
                <h2 class="text-xs font-bold text-zinc-500 tracking-widest uppercase mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path></svg>
                    Guías (Para exportar)
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-3">
                    <label class="flex items-center space-x-3 cursor-pointer group p-2 hover:bg-zinc-900 rounded-lg transition-colors border border-transparent hover:border-zinc-800">
                        <input type="checkbox" id="guideCenter" class="guide-checkbox">
                        <span class="text-sm font-medium text-zinc-300 group-hover:text-white">Cruz Central</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer group p-2 hover:bg-zinc-900 rounded-lg transition-colors border border-transparent hover:border-zinc-800">
                        <input type="checkbox" id="guideThirds" class="guide-checkbox">
                        <span class="text-sm font-medium text-zinc-300 group-hover:text-white">Regla de Tercios</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer group p-2 hover:bg-zinc-900 rounded-lg transition-colors border border-transparent hover:border-zinc-800">
                        <input type="checkbox" id="guideSafe" class="guide-checkbox">
                        <span class="text-sm font-medium text-zinc-300 group-hover:text-white">Márgenes Seguros</span>
                    </label>
                    
                    <div class="w-full h-px bg-zinc-800 my-1 col-span-full"></div>
                    
                    <label class="flex items-center space-x-3 cursor-pointer group p-2 hover:bg-zinc-900 rounded-lg transition-colors border border-transparent hover:border-zinc-800">
                        <input type="checkbox" id="guideCinema" class="guide-checkbox aspect-radio" onchange="manageAspects(this)">
                        <span class="text-sm font-medium text-zinc-300 group-hover:text-white">Cinemascope (2.35:1)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer group p-2 hover:bg-zinc-900 rounded-lg transition-colors border border-transparent hover:border-zinc-800">
                        <input type="checkbox" id="guideVertical" class="guide-checkbox aspect-radio" onchange="manageAspects(this)">
                        <span class="text-sm font-medium text-zinc-300 group-hover:text-white">Vertical (9:16)</span>
                    </label>
                </div>
            </section>
        </div>

        <!-- Footer / Export -->
        <footer class="p-5 bg-zinc-900 border-t border-zinc-800 shrink-0">
            <button id="exportBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.3)] transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Exportar PNG (Alta Calidad)
            </button>
        </footer>
    </aside>

    <script>
        // DOM Elements
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const baseImageInput = document.getElementById('baseImageInput');
        const logoImageInput = document.getElementById('logoImageInput');
        
        const logoScaleInput = document.getElementById('logoScale');
        const scaleValueDisplay = document.getElementById('scaleValue');
        const logoOpacityInput = document.getElementById('logoOpacity');
        const opacityValueDisplay = document.getElementById('opacityValue');
        
        const resetLogoBtn = document.getElementById('resetLogoBtn');
        const logoControlsSection = document.getElementById('logoControlsSection');
        const exportBtn = document.getElementById('exportBtn');
        const emptyState = document.getElementById('emptyState');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        
        // Guides
        const guides = {
            center: document.getElementById('guideCenter'),
            thirds: document.getElementById('guideThirds'),
            safe: document.getElementById('guideSafe'),
            cinema: document.getElementById('guideCinema'),
            vertical: document.getElementById('guideVertical')
        };

        // Aspect Ratio Mutual Exclusion
        window.manageAspects = function(selected) {
            if(selected.checked) {
                document.querySelectorAll('.aspect-radio').forEach(cb => {
                    if(cb !== selected) cb.checked = false;
                });
            }
            render();
        };

        // Application State
        let baseImg = null;
        let logoImg = null;
        let logoState = {
            x: 0, y: 0,
            baseWidth: 0, baseHeight: 0,
            scale: 1, opacity: 1,
            isDragging: false,
            dragOffsetX: 0, dragOffsetY: 0
        };

        // Create a programmatic initial background (Solves CORS forever)
        function createDefaultBackground() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 1920;
            tempCanvas.height = 1080;
            const tCtx = tempCanvas.getContext('2d');
            
            // Draw Gradient
            const gradient = tCtx.createRadialGradient(960, 540, 100, 960, 540, 1000);
            gradient.addColorStop(0, '#27272a'); // zinc-800
            gradient.addColorStop(1, '#09090b'); // zinc-950
            tCtx.fillStyle = gradient;
            tCtx.fillRect(0, 0, 1920, 1080);

            // Draw Text
            tCtx.fillStyle = '#52525b'; // zinc-600
            tCtx.font = 'bold 60px Inter, sans-serif';
            tCtx.textAlign = 'center';
            tCtx.textBaseline = 'middle';
            tCtx.fillText('SUBE TU IMAGEN BASE DESDE LOS ARCHIVOS', 1920/2, 1080/2);
            
            // Convert to image
            const defaultImg = new Image();
            defaultImg.onload = () => {
                baseImg = defaultImg;
                emptyState.style.display = 'none';
                canvas.classList.remove('opacity-0');
                render();
            };
            defaultImg.src = tempCanvas.toDataURL('image/jpeg', 0.8);
        }

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        function centerLogo() {
            if (!baseImg || !logoImg) return;
            const w = logoState.baseWidth * logoState.scale;
            const h = logoState.baseHeight * logoState.scale;
            logoState.x = (baseImg.width / 2) - (w / 2);
            logoState.y = (baseImg.height / 2) - (h / 2);
            render();
        }

        // Main Render Function
        function render() {
            if (!baseImg) return;

            // Set high-res internal dimensions
            canvas.width = baseImg.width;
            canvas.height = baseImg.height;

            // 1. Draw Background
            ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);

            // 2. Draw Logo
            if (logoImg) {
                ctx.globalAlpha = logoState.opacity;
                const w = logoState.baseWidth * logoState.scale;
                const h = logoState.baseHeight * logoState.scale;
                ctx.drawImage(logoImg, logoState.x, logoState.y, w, h);
                ctx.globalAlpha = 1.0; // Reset
            }

            // 3. Draw Aspect Masks
            drawMasks();

            // 4. Draw Line Guides
            drawGuides();
        }

        function drawMasks() {
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; // Dark mask

            let targetRatio = null;
            if (guides.cinema.checked) targetRatio = 2.35;
            if (guides.vertical.checked) targetRatio = 9 / 16;

            if (targetRatio) {
                const currentRatio = w / h;
                if (currentRatio < targetRatio) { // Letterbox (Top/Bottom)
                    const targetHeight = w / targetRatio;
                    const barHeight = (h - targetHeight) / 2;
                    ctx.fillRect(0, 0, w, barHeight);
                    ctx.fillRect(0, h - barHeight, w, barHeight);
                } else { // Pillarbox (Left/Right)
                    const targetWidth = h * targetRatio;
                    const barWidth = (w - targetWidth) / 2;
                    ctx.fillRect(0, 0, barWidth, h);
                    ctx.fillRect(w - barWidth, 0, barWidth, h);
                }
            }
        }

        function drawGuides() {
            const w = canvas.width, h = canvas.height;
            const lw = Math.max(2, w * 0.002); 
            ctx.lineWidth = lw;

            // Center Cross (Cyan/Blue)
            if (guides.center.checked) {
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)'; // light blue
                ctx.beginPath();
                ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h);
                ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
                ctx.stroke();
            }

            // Thirds (White)
            if (guides.thirds.checked) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.moveTo(w/3, 0); ctx.lineTo(w/3, h);
                ctx.moveTo(w/3*2, 0); ctx.lineTo(w/3*2, h);
                ctx.moveTo(0, h/3); ctx.lineTo(w, h/3);
                ctx.moveTo(0, h/3*2); ctx.lineTo(w, h/3*2);
                ctx.stroke();
            }

            // Safe Areas
            if (guides.safe.checked) {
                ctx.setLineDash([lw * 4, lw * 4]);
                
                // Action Safe (5% margin)
                ctx.strokeStyle = 'rgba(234, 179, 8, 0.8)'; // Yellow
                ctx.strokeRect(w * 0.05, h * 0.05, w * 0.9, h * 0.9);
                
                // Title Safe (10% margin)
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)'; // Red
                ctx.strokeRect(w * 0.1, h * 0.1, w * 0.8, h * 0.8);
                
                ctx.setLineDash([]);
            }
        }

        // --- Event Listeners ---

        // File Inputs
        function handleUpload(file, isBase) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (isBase) {
                        baseImg = img;
                        if(logoImg) centerLogo(); // Auto center if logo exists
                    } else {
                        logoImg = img;
                        logoState.baseWidth = img.width;
                        logoState.baseHeight = img.height;
                        logoControlsSection.classList.remove('opacity-50', 'pointer-events-none');
                        
                        // Auto scale logo to max 25% of base image width
                        if (baseImg) {
                            const targetW = baseImg.width * 0.25;
                            logoState.scale = Math.min(1, targetW / img.width);
                            logoScaleInput.value = logoState.scale;
                            scaleValueDisplay.innerText = Math.round(logoState.scale * 100) + '%';
                            centerLogo();
                        }
                    }
                    render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        baseImageInput.addEventListener('change', e => handleUpload(e.target.files[0], true));
        logoImageInput.addEventListener('change', e => handleUpload(e.target.files[0], false));

        // Controls
        logoScaleInput.addEventListener('input', e => {
            logoState.scale = parseFloat(e.target.value);
            scaleValueDisplay.innerText = Math.round(logoState.scale * 100) + '%';
            render();
        });

        logoOpacityInput.addEventListener('input', e => {
            logoState.opacity = parseFloat(e.target.value);
            opacityValueDisplay.innerText = Math.round(logoState.opacity * 100) + '%';
            render();
        });

        resetLogoBtn.addEventListener('click', centerLogo);

        Object.values(guides).forEach(chk => chk.addEventListener('change', render));

        // Export
        exportBtn.addEventListener('click', () => {
            if (!baseImg) return;
            render(); 
            try {
                // High Quality PNG Export
                const dataURL = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `EncuadrePro_${new Date().getTime()}.png`;
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("¡Imagen exportada con éxito!");
            } catch (err) {
                console.error("Export Error:", err);
                alert("Error al exportar. Asegúrate de haber subido una imagen desde tu dispositivo.");
            }
        });

        // --- Drag Logic ---
        function getPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function dragStart(e) {
            if (!logoImg || !baseImg) return;
            const pos = getPos(e);
            const w = logoState.baseWidth * logoState.scale;
            const h = logoState.baseHeight * logoState.scale;
            const pad = e.type.includes('touch') ? 50 : 0; 
            
            if (pos.x >= logoState.x - pad && pos.x <= logoState.x + w + pad &&
                pos.y >= logoState.y - pad && pos.y <= logoState.y + h + pad) {
                logoState.isDragging = true;
                logoState.dragOffsetX = pos.x - logoState.x;
                logoState.dragOffsetY = pos.y - logoState.y;
                if(e.cancelable) e.preventDefault(); 
            }
        }

        function dragMove(e) {
            if (!logoState.isDragging) return;
            const pos = getPos(e);
            logoState.x = pos.x - logoState.dragOffsetX;
            logoState.y = pos.y - logoState.dragOffsetY;
            render();
            if(e.cancelable) e.preventDefault();
        }

        function dragEnd() { logoState.isDragging = false; }

        canvas.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);
        canvas.addEventListener('touchstart', dragStart, { passive: false });
        window.addEventListener('touchmove', dragMove, { passive: false });
        window.addEventListener('touchend', dragEnd);

        // Boot
        createDefaultBackground();

    </script>
</body>
</html>
